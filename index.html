<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombor Boshqaruvi</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
        }
        .header {
            display: flex;
            align-items: center;
            background-color: #0088cc;
            color: white;
            padding: 12px 15px;
        }
        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
            user-select: none;
        }
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 10;
            top: 0;
            left: 0;
            background-color: #1e2b37;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
        }
        .sidebar a {
            padding: 12px 20px;
            text-decoration: none;
            font-size: 15px;
            color: #e1e1e1;
            display: block;
            border-bottom: 1px solid #2c3e50;
        }
        .sidebar a:hover {
            background-color: #2c3e50;
            color: #fff;
        }
        .sidebar .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            color: white;
            cursor: pointer;
        }
        .content {
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- YUQORI PANEL (3 TA CHIZIQCHA) -->
    <div class="header">
        <span class="menu-btn" onclick="openNav()">&#9776;</span>
        <h4 style="margin: 0;">Ombor Boshqaruvi</h4>
    </div>

    <!-- CHAP YON MENYU (ORGANIZATSIYALAR) -->
    <div id="mySidebar" class="sidebar">
        <span class="close-btn" onclick="closeNav()">&times;</span>
        <h5 style="color: #8fa0b5; padding-left: 20px; margin-bottom: 10px;">ORGANIZATSIYALAR</h5>
        <div id="org-list"></div>
    </div>

    <!-- ASOSIY OYNA -->
    <div class="content">
        <h3 id="user-greeting">Yuklanmoqda...</h3>
        <p id="user-info" style="color: #666; font-size: 14px;"></p>
        <div id="main-data" style="background: white; padding: 15px; border-radius: 8px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <p>Iltimos, organizatsiyani tanlash uchun chap yuqoridagi <b>☰</b> menyuni bosing.</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Foydalanuvchining Telegram ID sini olamiz
        const tgUser = tg.initDataUnsafe?.user;
        const currentUserId = tgUser ? tgUser.id : null;

        // BARCHA ORGANIZATSIYALAR RO'YXATI
        const allOrganizations = [
            "IO", "Бухара-2", "Зарафшан", "Навои", "Бухара", 
            "Коканд", "Наманган-2", "Андижан", "Фергана-2", 
            "EW", "Sterling Beverages", 
            "Шахрисабз", "Карши", "Денау", "Карши-2", "Термез", 
            "Нукус", "Хорезм", "Турткуль", 
            "Самарканд Трейдинг", "Самарканд Карвон", "Каттакурган", "Джиззак", 
            "Янгиюль", "Алмалык", "Сырдарья", "Чирчик"
        ];

        // =========================================================================
        // RUXSATLAR (ADMINLAR VA XODIMLAR)
        // =========================================================================
        
        // 1. ADMIN ID-lari (Barcha 27 ta organizatsiyani ko'radi)
        const ADMIN_IDS = [
            877709476 // <-- Ortqicha '5' raqami olib tashlandi, o'z ID raqamingizni shu yerga yozasiz
        ];

        // 2. 8 TA XODIMNING ID-SI VA ULARGA TEGISHLI ORGANIZATSIYALAR
        const EMPLOYEE_PERMISSIONS = {
            // Misol uchun: 1111111 ID raqamli xodim
            1111111: ["Коканд", "Фергана-2", "Андижан"],
            // Qolgan xodimlarni ID raqami va viloyatlarini shu yerga yozib chiqasiz
        };

        function getUserOrganizations(userId) {
            if (ADMIN_IDS.includes(userId)) {
                return allOrganizations; // Admin hamma organizatsiyani ko'radi
            }
            if (EMPLOYEE_PERMISSIONS[userId]) {
                return EMPLOYEE_PERMISSIONS[userId]; // Xodim faqat o'zinikini ko'radi
            }
            return []; // Agar bazada/ro'yxatda bo'lmasa
        }

        // MENYUNI TO'LDIRISH
        function renderSidebarMenu() {
            const allowedOrgs = getUserOrganizations(currentUserId);
            const container = document.getElementById("org-list");
            container.innerHTML = "";

            if (allowedOrgs.length === 0) {
                container.innerHTML = "<p style='color:#ff6b6b; padding: 15px;'>Sizga bu tizimdan foydalanishga ruxsat berilmagan!</p>";
                return;
            }

            allowedOrgs.forEach(org => {
                const a = document.createElement("a");
                a.href = "#";
                a.innerText = org;
                a.onclick = () => selectOrganization(org);
                container.appendChild(a);
            });
        }

        function selectOrganization(orgName) {
            document.getElementById("main-data").innerHTML = `
                <h4 style="margin-top:0; color:#0088cc;">${orgName}</h4>
                <p>Bu yerda ombordagi muzlatgichlar qoldig‘i va kiritish oynasi bo‘ladi.</p>
            `;
            closeNav();
        }

        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

        // SAHIFA OCHILgANDA
        window.onload = function() {
            if (tgUser) {
                document.getElementById("user-greeting").innerText = `Assalomu alaykum, ${tgUser.first_name}!`;
                const isAdmin = ADMIN_IDS.includes(currentUserId);
                document.getElementById("user-info").innerText = `ID: ${currentUserId} | Status: ${isAdmin ? 'Admin 👑' : 'Xodim 👤'}`;
            } else {
                document.getElementById("user-greeting").innerText = "Assalomu alaykum!";
                document.getElementById("user-info").innerText = "Test rejimi (Telegram ID aniqlanmadi)";
            }
            renderSidebarMenu();
        };
    </script>
</body>
</html>
