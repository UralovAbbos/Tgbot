<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ombor Boshqaruvi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;background:#0f1e36;color:#fff}
.header{background:#1e2b37;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.header b{font-size:15px}
.org-bar{padding:10px 15px;background:#142235}
select,input{width:100%;padding:10px;border-radius:6px;border:1px solid #2c3e50;background:#0f1e36;color:#fff;font-size:14px}
.tabs{display:flex;background:#1a2938;border-bottom:1px solid #2c3e50}
.tab{flex:1;padding:12px 4px;background:none;border:none;border-bottom:3px solid transparent;color:#8fa0b5;font-weight:bold;font-size:14px}
.tab.active{color:#0088cc;border-bottom-color:#0088cc}
.content{padding:15px}.pane{display:none}.pane.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.card{background:#192a3a;border:1px solid #23344c;border-radius:8px;padding:14px;margin-bottom:12px}
.card small,label{color:#8fa0b5;font-size:12px}
.big{font-size:24px;font-weight:bold;margin-top:4px}
label{display:block;margin:10px 0 4px}
.btn{width:100%;padding:12px;margin-top:14px;background:#0088cc;color:#fff;border:none;border-radius:6px;font-weight:bold}
.btn:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#142235;border-left:4px solid #0088cc;border-radius:6px;padding:10px;margin-bottom:8px;font-size:13px}
.row small{display:block;color:#8fa0b5;margin-top:3px}
.badge{padding:2px 7px;border-radius:4px;font-size:11px;font-weight:bold;margin-right:6px}
.b-ustanovka{background:#27ae60}.b-vozvrat{background:#f39c12}.b-remont{background:#e74c3c}
.b-remont_qaytdi{background:#8e44ad}.b-kirim{background:#2980b9}
.sm{border:none;border-radius:4px;color:#fff;padding:6px 9px;font-size:12px;background:#34495e;margin-left:4px}
.sm.red{background:#c0392b}.sm.green{background:#27ae60}
.muted{color:#8fa0b5;font-size:13px}
h4{margin:0 0 10px}
</style>
</head>
<body>
<div class="header"><b id="hdr">Ombor Boshqaruvi</b><span id="who"></span></div>
<div class="org-bar"><select id="org"></select></div>
<div class="tabs">
  <button class="tab active" data-t="main">📊 Main</button>
  <button class="tab" data-t="tasks">📝 Vazifalar</button>
  <button class="tab" data-t="history">🕒 Tarix</button>
</div>
<div class="content">
  <div id="p-main" class="pane active">
    <div class="grid">
      <div class="card"><small>Omborda (zaxira)</small><div class="big" id="s-stock" style="color:#f1c40f">0</div></div>
      <div class="card"><small>Ta'mirda</small><div class="big" id="s-repair" style="color:#e74c3c">0</div></div>
    </div>
    <input id="q-main" placeholder="🔍 Model qidirish...">
    <div id="inv" style="margin-top:10px"></div>
  </div>

  <div id="p-tasks" class="pane">
    <div class="card">
      <h4>Yangi amal</h4>
      <label>Amal turi</label>
      <select id="action">
        <option value="ustanovka">Ustanovka (o'rnatish)</option>
        <option value="vozvrat">Vozvrat (qaytarish)</option>
        <option value="remont">Remontga berish</option>
        <option value="remont_qaytdi">Remontdan qaytdi</option>
        <option value="kirim">Omborga kirim</option>
      </select>
      <label>Muzlatgich modeli</label>
      <input id="q-model" placeholder="🔍 Model qidirish..." style="margin-bottom:6px">
      <select id="model"></select>
      <label>Soni</label>
      <input type="number" id="qty" value="1" min="1" max="10000" inputmode="numeric">
      <button class="btn" id="save">Saqlash</button>
      <div class="muted" id="task-note" style="margin-top:8px"></div>
    </div>
  </div>

  <div id="p-history" class="pane">
    <div id="admin-box" style="display:none">
      <h4>👥 Xodimlar dostupi</h4><div id="users"></div><hr style="border-color:#23344c;margin:15px 0">
    </div>
    <h4>Amallar tarixi</h4>
    <div id="hist"></div>
  </div>
</div>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const API = "https://SIZNING-DOMEN/api";   // <-- HTTPS server manzilingiz
const L = {ustanovka:"Ustanovka",vozvrat:"Vozvrat",remont:"Remontga",remont_qaytdi:"Remontdan qaytdi",kirim:"Kirim"};
const $ = id => document.getElementById(id);
let me, orgs = [], models = [], org = "", cur = "main", invItems = [];

function el(tag, cls, text){const e=document.createElement(tag); if(cls)e.className=cls; if(text!==undefined)e.textContent=text; return e}
async function api(path, opt={}){
  const r = await fetch(API+path, {...opt, headers:{"Content-Type":"application/json","X-Init-Data":tg.initData}});
  let d = {}; try{d = await r.json()}catch(e){}
  if(!r.ok) throw new Error(typeof d.detail==="string" ? d.detail : "Noto'g'ri ma'lumot");
  return d;
}
const msg = t => tg.showAlert ? tg.showAlert(t) : alert(t);

function show(tab){
  cur = tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.t===tab));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("active", p.id==="p-"+tab));
  refresh();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.t));
$("org").onchange = () => { org = $("org").value; $("hdr").textContent = $("org").selectedOptions[0].text; refresh(); };

function refresh(){
  if(cur==="main") loadMain();
  else if(cur==="tasks") taskNote();
  else { loadHistory(); if(me.is_admin) loadUsers(); }
}

// ---------- MAIN ----------
async function loadMain(){
  try{
    const d = await api("/inventory?org="+encodeURIComponent(org));
    $("s-stock").textContent = d.stock; $("s-repair").textContent = d.repair;
    invItems = d.items; renderInv();
  }catch(e){ msg(e.message) }
}
function renderInv(){
  const q = $("q-main").value.toLowerCase(), box = $("inv"); box.replaceChildren();
  const list = invItems.filter(i=>i.product.toLowerCase().includes(q));
  if(!list.length) box.append(el("p","muted","Qoldiq yo'q. «Vazifalar» bo'limida «Omborga kirim» orqali qo'shing."));
  list.forEach(i=>{
    const r = el("div","row"); r.append(el("span","",i.product));
    const s = el("span","", `📦 ${i.stock}  🔧 ${i.repair}`); s.style.whiteSpace="nowrap"; r.append(s); box.append(r);
  });
}
$("q-main").oninput = renderInv;

// ---------- VAZIFALAR ----------
function fillModels(){
  const q = $("q-model").value.toLowerCase(), s = $("model"); s.replaceChildren();
  models.filter(m=>m.toLowerCase().includes(q)).forEach(m=>{const o=el("option","",m); o.value=m; s.append(o)});
}
$("q-model").oninput = fillModels;
function taskNote(){
  const all = org==="ALL";
  $("save").disabled = all;
  $("task-note").textContent = all ? "Amal kiritish uchun yuqoridan aniq filialni tanlang." : "Filial: "+org;
}
$("save").onclick = async () => {
  const qty = parseInt($("qty").value);
  if(!qty || qty<1) return msg("Sonni to'g'ri kiriting!");
  if(!$("model").value) return msg("Model tanlang!");
  $("save").disabled = true;
  try{
    const d = await api("/tasks",{method:"POST",body:JSON.stringify({org, action:$("action").value, product:$("model").value, qty})});
    msg(d.message); $("qty").value = 1;
  }catch(e){ msg(e.message) }
  $("save").disabled = false;
};

// ---------- TARIX ----------
async function loadHistory(){
  const box = $("hist"); box.replaceChildren();
  try{
    const logs = await api("/history?org="+encodeURIComponent(org));
    if(!logs.length) box.append(el("p","muted","Hozircha amallar yo'q."));
    logs.forEach(l=>{
      const r = el("div","row"), left = el("div");
      const line = el("div"); line.append(el("span","badge b-"+l.action_type, (L[l.action_type]||l.action_type).toUpperCase()));
      left.append(line);
      const t = el("strong","",`${l.product_name} (${l.qty} ta)`); t.style.display="block"; t.style.marginTop="4px"; left.append(t);
      left.append(el("small","",`${org==="ALL"?l.org_name+" | ":""}${l.user_name} | ${l.timestamp}`));
      r.append(left);
      if(me.can_edit){
        const b = el("button","sm red","🗑️");
        b.onclick = () => tg.showConfirm("Yozuv o'chirilsinmi? Qoldiq ham qaytariladi.", async ok=>{
          if(!ok) return;
          try{ msg((await api("/history/"+l.id,{method:"DELETE"})).message); loadHistory() }catch(e){ msg(e.message) }
        });
        r.append(b);
      }
      box.append(r);
    });
  }catch(e){ msg(e.message) }
}

// ---------- ADMIN: XODIMLAR ----------
async function loadUsers(){
  $("admin-box").style.display = "block";
  const box = $("users"); box.replaceChildren();
  try{
    (await api("/admin/users")).forEach(u=>{
      const r = el("div","row"), left = el("div");
      left.append(el("strong","",u.name), el("small","",`ID: ${u.id}`), el("small","",u.orgs.join(", ")));
      const act = el("div"); act.style.whiteSpace="nowrap";
      const t = el("button","sm "+(u.can_edit?"green":""), u.can_edit?"✏️ Ruxsat bor":"🔒 Ruxsat yo'q");
      t.onclick = async()=>{ try{ await api("/admin/users/"+u.id,{method:"PATCH",body:JSON.stringify({can_edit:!u.can_edit})}); loadUsers() }catch(e){ msg(e.message) } };
      const i = el("button","sm","ID");
      i.onclick = async()=>{
        const v = prompt("Yangi Telegram ID:", u.id); if(!v) return;
        if(!/^\d+$/.test(v)) return msg("ID faqat raqam bo'lishi kerak");
        try{ await api("/admin/users/"+u.id,{method:"PATCH",body:JSON.stringify({new_id:parseInt(v)})}); loadUsers() }catch(e){ msg(e.message) }
      };
      act.append(t,i); r.append(left,act); box.append(r);
    });
  }catch(e){ msg(e.message) }
}

// ---------- BOSHLASH ----------
(async()=>{
  if(!tg.initData){ document.body.replaceChildren(el("p","muted","Iltimos, ilovani Telegram bot orqali oching.")); return }
  try{
    const d = await api("/meta"); me = d.me; orgs = d.orgs; models = d.models;
    $("who").textContent = `${me.name} ${me.is_admin?"👑":"👤"}`;
    const sel = $("org");
    if(me.is_admin){ const o=el("option","","📦 Barcha filiallar"); o.value="ALL"; sel.append(o) }
    orgs.forEach(x=>{const o=el("option","",x); o.value=x; sel.append(o)});
    org = sel.value; $("hdr").textContent = sel.selectedOptions[0].text;
    fillModels(); refresh();
  }catch(e){ document.body.replaceChildren(el("p","muted",e.message)) }
})();
</script>
</body>
</html>
