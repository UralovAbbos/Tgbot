<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombor Boshqaruvi</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background-color: #0f1e36; color: #ffffff;
        }
        .header {
            display: flex; align-items: center;
            background-color: #1e2b37; color: white;
            padding: 12px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .menu-btn { font-size: 24px; cursor: pointer; margin-right: 15px; user-select: none; }
        
        /* SIDEBAR MENYU */
        .sidebar {
            height: 100%; width: 0; position: fixed; z-index: 100; top: 0; left: 0;
            background-color: #142235; overflow-x: hidden; transition: 0.3s; padding-top: 60px;
        }
        .sidebar a {
            padding: 12px 20px; text-decoration: none; font-size: 15px;
            color: #e1e1e1; display: block; border-bottom: 1px solid #233448;
        }
        .sidebar a:hover { background-color: #0088cc; color: #fff; }
        .sidebar .close-btn { position: absolute; top: 10px; right: 20px; font-size: 28px; color: white; cursor: pointer; }

        /* TAB NAVIGATSIYA (Faqat Main va Tarix qoldi) */
        .tab-nav { display: flex; background-color: #1a2938; border-bottom: 1px solid #2c3e50; }
        .tab-btn {
            flex: 1; padding: 12px 5px; text-align: center; background: none; border: none;
            color: #8fa0b5; font-weight: bold; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent;
        }
        .tab-btn.active { color: #0088cc; border-bottom: 3px solid #0088cc; }

        .content { padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-card { background-color: #192a3a; padding: 15px; border-radius: 8px; border: 1px solid #23344c; }
        .stat-card h4 { margin: 0 0 5px 0; font-size: 13px; color: #8fa0b5; }
        .stat-card .value { font-size: 20px; font-weight: bold; color: #ffffff; }

        .card { background-color: #192a3a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #23344c; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #8fa0b5; margin-bottom: 4px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #2c3e50;
            background-color: #0f1e36; color: white; font-size: 14px;
        }
        .btn-submit {
            width: 100%; padding: 12px; background-color: #0088cc; color: white;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .log-item {
            background-color: #142235; padding: 12px; border-radius: 6px; margin-bottom: 8px;
            border-left: 4px solid #0088cc; display: flex; justify-content: space-between; align-items: center;
        }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-ustanovka { background-color: #27ae60; color: white; }
        .badge-vozvrat { background-color: #f39c12; color: white; }
        .badge-remont { background-color: #e74c3c; color: white; }
        .btn-delete { background-color: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <span class="menu-btn" onclick="openNav()">&#9776;</span>
        <h4 style="margin: 0; flex-grow: 1;" id="header-title">Ombor Boshqaruvi</h4>
    </div>

    <div id="mySidebar" class="sidebar">
        <span class="close-btn" onclick="closeNav()">&times;</span>
        <h5 style="color: #8fa0b5; padding-left: 20px; margin-bottom: 10px;">ORGANIZATSIYALAR</h5>
        <div id="org-list"></div>
    </div>

    <div style="background-color: #142235; padding: 8px 15px; font-size: 12px; color: #8fa0b5; border-bottom: 1px solid #1a2938;">
        <span id="user-greeting">Yuklanmoqda...</span> | <span id="user-info"></span>
    </div>

    <!-- TAB MENYU (Faqat Main va Tarix) -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('main')">📊 Main</button>
        <button class="tab-btn" onclick="switchTab('history')">🕒 Tarix</button>
    </div>

    <div class="content">

        <!-- 1. MAIN TAB (Vazifalar, ombor qoldig'i va kiritish shu yerda joylashdi) -->
        <div id="tab-main" class="tab-content active">
            <h4 id="selected-org-name" style="margin-top: 0; color: #0088cc;">Organizatsiyani tanlang</h4>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Omborda (Zaxira)</h4>
                    <div class="value" id="stat-stock" style="color: #f1c40f;">0</div>
                </div>
                <div class="stat-card">
                    <h4>Ta'mirda</h4>
                    <div class="value" id="stat-repair" style="color: #e74c3c;">0</div>
                </div>
            </div>

            <!-- YANGI AMAL KIRITISH FORMASI -->
            <div class="card">
                <h4 style="margin-top: 0;">Yangi Amal Kiritish</h4>
                <div class="form-group">
                    <label>Amal turi</label>
                    <select id="action-type">
                        <option value="ustanovka">Ustanovka (O'rnatish)</option>
                        <option value="vozvrat">Vozvrat (Qaytarish)</option>
                        <option value="remont">Remontga berish</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Muzlatgich Modeli (XO)</label>
                    <select id="xo-model" onchange="loadInventoryData()">
                        <option value="UBC PEARL Pepsi 0,5-Д">UBC PEARL Pepsi 0,5-Д</option>
                        <option value="UGUR USS 374 PEPSI 1-Д">UGUR USS 374 PEPSI 1-Д</option>
                        <option value="Klimasan D372 PEPSI 1-Д">Klimasan D372 PEPSI 1-Д</option>
                        <option value="UGUR USS690 PEPSI 1,5-Д">UGUR USS690 PEPSI 1,5-Д</option>
                        <option value="Klimasan S 770 PEPSI 1,5-Д">Klimasan S 770 PEPSI 1,5-Д</option>
                        <option value="UBC PRIME XL Pepsi 1,5-Д">UBC PRIME XL Pepsi 1,5-Д</option>
                        <option value="UBC IDEAL LARGE Pepsi 2-Д">UBC IDEAL LARGE Pepsi 2-Д</option>
                        <option value="Klimasan S880 PEPSI 2-Д">Klimasan S880 PEPSI 2-Д</option>
                        <option value="Klimasan S900 PEPSI 2-Д">Klimasan S900 PEPSI 2-Д</option>
                        <option value="UGUR USS 1000 PEPSI 2-Д">UGUR USS 1000 PEPSI 2-Д</option>
                        <option value="Klimasan S1200 PEPSI 2-Д">Klimasan S1200 PEPSI 2-Д</option>
                        <option value="UGUR USS 1600 PEPSI 3-Д">UGUR USS 1600 PEPSI 3-Д</option>
                        <option value="UGUR USS1500 Pepsi 5-Д">UGUR USS1500 Pepsi 5-Д</option>
                        <option value="Klimasan S1600 PEPSI 5-Д">Klimasan S1600 PEPSI 5-Д</option>
                        <option value="UBC Extra Large Pepsi 5-Д">UBC Extra Large Pepsi 5-Д</option>
                        <option value="OpenFront">OpenFront</option>
                        <option value="RGB">RGB</option>
                        <option value="UBC OMEGA Pepsi 1,5-Д">UBC OMEGA Pepsi 1,5-Д</option>
                        <option value="UBC EXTRA LARGE Pepsi 3-Д">UBC EXTRA LARGE Pepsi 3-Д</option>
                        <option value="UGUR USS 810 PEPSI 1,5-Д">UGUR USS 810 PEPSI 1,5-Д</option>
                        <option value="UGUR USS 900 PEPSI 2-Д">UGUR USS 900 PEPSI 2-Д</option>
                        <option value="UGUR USS 1200 PEPSI 2-Д">UGUR USS 1200 PEPSI 2-Д</option>
                        <option value="Klimasan S1300 PEPSI NEON 2-Д">Klimasan S1300 PEPSI NEON 2-Д</option>
                        <option value="Klimasan S 770 PEPSI NEON 1,5-Д">Klimasan S 770 PEPSI NEON 1,5-Д</option>
                        <option value="UGUR USS750 PEPSI 1,5-Д">UGUR USS750 PEPSI 1,5-Д</option>
                        <option value="Klimasan S 1100 PEPSI 2-Д">Klimasan S 1100 PEPSI 2-Д</option>
                        <option value="Klimasan S1600 PEPSI LUNA 2D">Klimasan S1600 PEPSI LUNA 2D</option>
                        <option value="UGUR USS1500 Pepsi 3-Д">UGUR USS1500 Pepsi 3-Д</option>
                        <option value="Klimasan S1600 PEPSI LUNA 3D">Klimasan S1600 PEPSI LUNA 3D</option>
                        <option value="Klimasan S1600 PEPSI WOC 3-Д">Klimasan S1600 PEPSI WOC 3-Д</option>
                        <option value="UGUR USS 420 DTK LEAN Premium PEPSI 1,5-Д">UGUR USS 420 DTK LEAN Premium PEPSI 1,5-Д</option>
                        <option value="ARTEL Shivaki SHS190SN PEPSI">ARTEL Shivaki SHS190SN PEPSI</option>
                        <option value="Simfer SDS 710 DC 1 YF Neon PEPSI">Simfer SDS 710 DC 1 YF Neon PEPSI</option>
                        <option value="UGUR USS 1200 D2K UCOOL Neon PEPSI">UGUR USS 1200 D2K UCOOL Neon PEPSI</option>
                        <option value="Simfer SDS 1210 DC 2 YF Neon PEPSI">Simfer SDS 1210 DC 2 YF Neon PEPSI</option>
                        <option value="UGUR USS 1600 D2K FIBER PEPSI">UGUR USS 1600 D2K FIBER PEPSI</option>
                        <option value="UGUR USS 420 Pepsi">UGUR USS 420 Pepsi</option>
                        <option value="UGUR USS 374 Pepsi New">UGUR USS 374 Pepsi New</option>
                        <option value="Simfer SDS 1510 DC 2 YF LEGEND PEPSI">Simfer SDS 1510 DC 2 YF LEGEND PEPSI</option>
                        <option value="UGUR USS 420 Rock star 1,5-Д">UGUR USS 420 Rock star 1,5-Д</option>
                        <option value="USS175 Rock star 0,5-Д">USS175 Rock star 0,5-Д</option>
                        <option value="UGUR USS 374 Rock star 1-Д">UGUR USS 374 Rock star 1-Д</option>
                        <option value="Klimasan D372 LIPTON 1-Д">Klimasan D372 LIPTON 1-Д</option>
                        <option value="UGUR USS 374 LIPTON 1-Д">UGUR USS 374 LIPTON 1-Д</option>
                        <option value="Klimasan S1200 LIPTON 2-Д">Klimasan S1200 LIPTON 2-Д</option>
                        <option value="UGUR USS 420 DTK LEAN Premium LIPTON">UGUR USS 420 DTK LEAN Premium LIPTON</option>
                        <option value="UGUR USS 420 DTK LEAN LIPTON">UGUR USS 420 DTK LEAN LIPTON</option>
                        <option value="Simfer SDS 710 DC 1 YF Neon LIPTON">Simfer SDS 710 DC 1 YF Neon LIPTON</option>
                        <option value="МиниХО">МиниХО</option>
                        <option value="UGUR USS 420 Ad. Rush 1,5-Д">UGUR USS 420 Ad. Rush 1,5-Д</option>
                        <option value="UBC SLIM AR PREMIUM 0,5-Д">UBC SLIM AR PREMIUM 0,5-Д</option>
                        <option value="USS175 Ad. Rush 0,5-Д">USS175 Ad. Rush 0,5-Д</option>
                        <option value="UBC PEARL Ad. Rush 0,5-Д">UBC PEARL Ad. Rush 0,5-Д</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Soni</label>
                    <input type="number" id="xo-qty" value="1">
                </div>
                <button class="btn-submit" onclick="submitTask()">Saqlash</button>
            </div>
        </div>

        <!-- 2. TARIX TAB -->
        <div id="tab-history" class="tab-content">
            <h4 style="margin-top: 0;">Amallar Tarixi</h4>
            <div id="history-list">
                <p style="color: #8fa0b5;">Ma'lumotlar yuklanmoqda...</p>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const tgUser = tg.initDataUnsafe?.user;
        const currentUserId = tgUser ? tgUser.id : 8777094765; // Test uchun default ID
        const currentUserFullName = tgUser ? tgUser.first_name : "Abbos";

        const API_URL = "http://127.0.0.1:8000/api"; // Server manzili (Cloud'ga chiqqanda o'zgaradi)

        const allOrganizations = [
            "Admin (Barcha filiallarga dostup)", 
            "IO", "Бухара-2", "Зарафшан", "Навои", "Бухара", 
            "Коканд", "Наманган-2", "Андижан", "Фергана-2", 
            "EW", "Sterling Beverages", 
            "Шахрисабз", "Карши", "Денау", "Карши-2", "Термез", 
            "Нукус", "Хорезм", "Турткуль", 
            "Самарканд Трейдинг", "Самарканд Карвон", "Каттакурган", "Джиззак", 
            "Янгиюль", "Алмалык", "Сырдарья", "Чирчик"
        ];

        let selectedOrg = null;
        let userRole = "employee";

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            if(tabName === 'history') loadHistory();
        }

        function openNav() { document.getElementById("mySidebar").style.width = "250px"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

        function renderSidebarMenu() {
            const container = document.getElementById("org-list");
            container.innerHTML = "";

            allOrganizations.forEach(org => {
                const a = document.createElement("a");
                a.href = "#";
                a.innerText = org;
                a.onclick = () => selectOrganization(org);
                container.appendChild(a);
            });
        }

        async function selectOrganization(orgName) {
            selectedOrg = orgName;
            document.getElementById("selected-org-name").innerText = orgName;
            document.getElementById("header-title").innerText = orgName;
            closeNav();
            loadInventoryData();
        }

        // Bazadan tanlangan XO qoldig'ini olish
        async function loadInventoryData() {
            if (!selectedOrg) return;
            const model = document.getElementById("xo-model").value;
            
            try {
                const res = await fetch(`${API_URL}/inventory?org_name=${encodeURIComponent(selectedOrg)}&product_name=${encodeURIComponent(model)}`);
                const data = await res.json();
                document.getElementById("stat-stock").innerText = data.stock;
                document.getElementById("stat-repair").innerText = data.repair;
            } catch (err) {
                console.error("Xatolik:", err);
            }
        }

        // Amalni saqlash va bazaga yuborish
        async function submitTask() {
            if (!selectedOrg) {
                alert("Iltimos, oldin menyudan organizatsiyani tanlang!");
                return;
            }
            const type = document.getElementById("action-type").value;
            const model = document.getElementById("xo-model").value;
            const qty = document.getElementById("xo-qty").value;

            const payload = {
                org_name: selectedOrg,
                action_type: type,
                product_name: model,
                qty: parseInt(qty),
                user_name: currentUserFullName
            };

            try {
                const res = await fetch(`${API_URL}/submit-task`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                alert(result.message);
                loadInventoryData(); // Qoldiqni yangilash
            } catch (err) {
                alert("Server bilan aloqa yo'q!");
            }
        }

        // Tarixni yuklab kelish
        async function loadHistory() {
            if (!selectedOrg) {
                document.getElementById("history-list").innerHTML = "<p>Oldin organizatsiyani tanlang!</p>";
                return;
            }
            try {
                const res = await fetch(`${API_URL}/history?org_name=${encodeURIComponent(selectedOrg)}`);
                const logs = await res.json();
                
                const container = document.getElementById("history-list");
                container.innerHTML = "";

                if (logs.length === 0) {
                    container.innerHTML = "<p style='color:#8fa0b5;'>Hozircha amallar tarixi yo'q.</p>";
                    return;
                }

                logs.forEach(log => {
                    const div = document.createElement("div");
                    div.className = "log-item";
                    div.innerHTML = `
                        <div>
                            <span class="badge badge-${log.action_type}">${log.action_type.toUpperCase()}</span>
                            <strong style="font-size: 13px; display: block; margin-top: 3px;">${log.product_name} (${log.qty} ta)</strong>
                            <small style="color: #8fa0b5;">Kiritdi: ${log.user_name} | ${log.timestamp}</small>
                        </div>
                        ${userRole === 'admin' ? `<button class="btn-delete" onclick="deleteLog(${log.id})">🗑️</button>` : ''}
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteLog(id) {
            if (confirm("Haqiqatan ham bu yozuvni o'chirmoqchimisiz?")) {
                await fetch(`${API_URL}/history/${id}`, { method: "DELETE" });
                loadHistory();
            }
        }

        window.onload = async function() {
            try {
                const res = await fetch(`${API_URL}/user-data?user_id=${currentUserId}`);
                const data = await res.json();
                userRole = data.role;
                document.getElementById("user-greeting").innerText = `Salom, ${data.full_name}!`;
                document.getElementById("user-info").innerText = `Status: ${data.role === 'admin' ? 'Admin 👑' : 'Xodim 👤'}`;
            } catch (e) {
                document.getElementById("user-greeting").innerText = `Salom, ${currentUserFullName}!`;
            }
            renderSidebarMenu();
        };
    </script>
</body>
</html>
